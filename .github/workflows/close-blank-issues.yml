name: Close Blank Issues

on:
  issues:
    types: [opened]

jobs:
  close-blank-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.issue.user.login;
            const isOwner = author === context.repo.owner;

            const body = context.payload.issue.body;
            const templateMarkers = ['وصف المشكلة', 'وصف الوظيفة'];
            const usedTemplate = body && templateMarkers.some(marker => body.includes(marker));

            if (!isOwner && !usedTemplate) {
              const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: [
                  'شكرًا على ملاحظاتك!هذا Issue لم يتم استخدام القالب الرسمي،تم الإغلاق تلقائيًا.',
                  'انقر على الرابط أدناه لإعادة الإرسال،واختر القالب المناسب لملء المعلومات كاملة:',
                  '',
                  `- 🐛 [Bug تقرير](${repoUrl}/issues/new?template=bug-report.yml)`,
                  `- ✨ [طلب ميزة](${repoUrl}/issues/new?template=feature-request.yml)`,
                  '',
                  '---',
                  '',
                  'Thanks for your feedback! This issue was closed because it was not submitted using the official template.',
                  'Please resubmit using one of the templates below:',
                  '',
                  `- 🐛 [Bug Report](${repoUrl}/issues/new?template=bug-report.yml)`,
                  `- ✨ [Feature Request](${repoUrl}/issues/new?template=feature-request.yml)`,
                ].join('\n'),
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: 'closed',
              });
            }
