name: Build Nexora

on:
  # يدعم أيضًا التشغيل اليدوي
  workflow_dispatch:

jobs:
  # تحقق من السجل السابق 24 هل هناك التزام جديد خلال الساعات،إن لم يكن موجوداً فتخطَّ البناء،تجنّب حزم العناصر مكررًا
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for recent commits
        id: check
        run: |
          # بناء بدون شرط عند التشغيل اليدوي
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # تنبيه مجدول:فقط عندما يكون في الماضي 24 يبنى فقط إذا كان هناك التزام جديد خلال الساعات
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "الماضي 24 لا توجد التزامات جديدة خلال الساعات،تخطي البناء"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # نشر Release يتطلب أذونات كتابة

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # سحب الوحدات الفرعية

      # و Android Studio مرفق JetBrains Runtime 21 الحفاظ على الاتساق
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          # jetbrains المثبت عبر GitHub API التحقق من الإصدار،أرفق token تجنّب التقييد بمعدل الطلبات
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # web الخاص بالوحدة preBuild سينفذ `pnpm run build` بناء الواجهة الأمامية،يجب أن تكون جاهزًا Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle ـ buildWebUi تشغيل المهمة فقط build لا يتم التشغيل install،تتطلب تثبيت الاعتماديات مسبقًا هنا
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          # فك الترميزbase64مشفَّرkeystoreملف
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key

          # كتابة إعداد التوقيع إلىlocal.properties
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties

          # كتابةGoogle Servicesتكوين

      - name: Validate google-services
        run: |
          wc -c app/google-services.json
          python3 -c "import json; json.load(open('app/google-services.json')); print('JSON OK')"

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # ضع APK انشر مباشرة كـ Prerelease،ينقر المستخدم الرابط لتنزيل عنصر واحد apk،لا حاجة لتسجيل الدخول،لا حاجة لفك الضغط
      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: Nexora Latest Build
          prerelease: false
          body: |
            Automated build (commit `${{ github.sha }}`)

            > Based on RikkaHub (AGPL-3.0).
          files: app/build/outputs/apk/release/*.apk
