name: Bug Report
description: تقريرAPP Bugأو تعطل
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        شكرًا لتخصيصك الوقت للإرسال تقرير خطأ برمجي (Bug Report)!يرجى تقديم معلومات كاملة قدر الإمكان لكي نتمكن من إعادة إنتاج المشكلة وإصلاحها.
        Thanks for taking the time to report a bug! Please fill in as much detail as possible.

        > **تنبيه | Note**
        > لا تُقدّم من قِبل AI المُولد Issue،من هذا النوع Issue سيتم إقفاله مباشرة.
        > Do not submit AI-generated issues — they will be closed without review.

  - type: textarea
    id: description
    attributes:
      label: وصف المشكلة | Problem Description
      description: يرجى وصف المشكلة التي تواجهها بالتفصيل،يشملخطوات إعادة تكرار الخطأ. / Describe the issue in detail, including steps to reproduce.
      placeholder: |
        1. دخول ...
        2. انقر ...
        3. ظهر ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: السلوك المتوقع | Expected Behavior
      description: ماذا تتوقع أن يحدث؟ / What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: التقاط شاشة | Screenshots
      description: إذا كانت هناك لقطات شاشة أو تسجيلات ذات صلة،يرجى اللصق هنا. / Attach relevant screenshots or screen recordings here.
    validations:
      required: false

  - type: input
    id: provider
    attributes:
      label: المزود المستخدم | Provider
      description: مثال OpenAI،Anthropic،Google،الانتشار المحلي وما إلى ذلك / e.g. OpenAI, Anthropic, Google, local deployment
      placeholder: OpenAI
    validations:
      required: false

  - type: input
    id: model
    attributes:
      label: النموذج المستخدم | Model
      description: مثال gpt-4o،claude-3-5-sonnet إلخ / e.g. gpt-4o, claude-3-5-sonnet
      placeholder: gpt-4o
    validations:
      required: false

  - type: dropdown
    id: api-type
    attributes:
      label: نوع الواجهة | API Type
      description: نوع بروتوكول الواجهة المستخدم / The API protocol type being used
      options:
        - OpenAI ChatCompletion
        - Response API
        - Google Gemini
        - Anthropic
    validations:
      required: false

  - type: input
    id: app-version
    attributes:
      label: APP الإصدار | App Version
      description: مثال v1.2.3 / e.g. v1.2.3
      placeholder: v1.2.3
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: إصدار أندرويد | Android Version
      description: مثال Android 14 / e.g. Android 14
      placeholder: Android 14
    validations:
      required: true

  - type: input
    id: device-model
    attributes:
      label: طراز الهاتف | Device Model
      description: مثال Xiaomi 14 / e.g. Xiaomi 14
      placeholder: Xiaomi 14
    validations:
      required: true
