name: Feature Request
description: طلب ميزة جديدة
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > **تنبيه | Note**
        > إذا رغبت في طلب ميزة جديدة،يرجى مناقشة الموضوع معي أولاً في مجموعة الدردشة،وإلا فقد يُغلق طلب الميزة مباشرة.
        > If you want to request a new feature, please discuss it with me in the chat group first, otherwise your feature request may be closed directly.
        >
        > قبول طلب الميزة يعتمد على ضرورته وتأثيره على قاعدة الشيفرة،ليس كل الطلبات سيتم قبولها.
        > Whether a feature request is accepted depends on its necessity and impact on the codebase — not all requests will be accepted.

  - type: textarea
    id: description
    attributes:
      label: وصف الوظيفة | Feature Description
      description: يرجى وصف الميزة الجديدة التي ترغب في إضافتها بالتفصيل. / Describe the new feature you are requesting.
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: حالات الاستخدام | Usage Scenario
      description: وصف السيناريوهات التي يُستخدم فيها هذا الميزات،كيف يساعدك هذا. / Describe the scenario in which this feature would be used and how it would help you.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: بدائل | Alternatives Considered
      description: هل هناك حلول بديلة لهذه المتطلبات؟إذا كان هناك،يرجى التوضيح. / Are there any alternative solutions or workarounds you've considered?
    validations:
      required: false
